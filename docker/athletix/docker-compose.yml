# CT 106 — athletix-dev (192.168.18.198 / Tailscale 100.109.199.70)
# PostgreSQL 16 for the Athletix athlete monitoring system
# A read-only role is provisioned at init via docker-entrypoint-initdb.d
# Port 5432 exposed on all interfaces (LAN + Tailscale)

services:
  db:
    image: postgres:16-alpine
    container_name: athletix-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_RO_USER: ${POSTGRES_RO_USER}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
